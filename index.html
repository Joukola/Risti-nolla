<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#245b40"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.svg"><title>Ristinolla</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#347d53,#153e2b);color:white;font:18px system-ui;min-height:100dvh}main{max-width:620px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(18px,4vw,26px)}button,select{font:inherit;border:0;border-radius:8px;padding:10px;background:#e0efdf;color:#173c29;cursor:pointer;touch-action:manipulation}#menu{position:absolute;right:12px;top:65px;background:#173e2b;padding:12px;border-radius:12px;z-index:10;box-shadow:0 6px 20px #0006}#menu button,#menu select{display:block;width:100%;margin:5px 0}#board{display:grid;gap:5px;aspect-ratio:1;touch-action:manipulation}.cell{background:#193e2d;padding:0;display:grid;place-items:center;min-width:0;min-height:0;border-radius:8px}.cell svg{width:80%;height:80%;animation:appear .3s ease-out}.win{background:#557f40;animation:pulse .6s alternate infinite}.hint{outline:3px solid #f9e08b;outline-offset:-3px}@keyframes appear{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes pulse{to{background:#82a85b}}#status{padding:12px 0;min-height:48px;text-align:center}#info{min-height:50px;padding-top:12px}small{opacity:.65}[hidden]{display:none!important}</style><main><header><h1 id="title"></h1><button id="toggle" aria-label="Menu">☰</button></header><div id="menu" hidden><select id="variant"></select><button id="new"></button><select id="size"><option value="3">3 × 3</option><option value="5">5 × 5</option><option value="10">10 × 10</option></select><select id="mode"></select><select id="level"></select><button id="undo"></button><button id="hint"></button><button id="analysis"></button><select id="lang"><option value="fi">Suomi</option><option value="hu">Magyar</option><option value="en">English</option></select></div><div id="status" aria-live="polite"></div><div id="pick" hidden style="display:flex;justify-content:center;gap:12px;margin-bottom:12px"><button id="pickX" style="font-size:32px;color:#b45c16">X</button><button id="pickO" style="font-size:32px;color:#176da8">O</button></div><div id="board"></div><div id="info" aria-live="polite"></div><small>v0.1.4</small></main><script>
const $=id=>document.getElementById(id),D={fi:['Siskon parempi ristinolla','Uusi peli','Peru','Vihje','Analyysi','Kaksi pelaajaa','Tietokone vastaan','Helppo','Keskitaso','Vaikea','vuorossa','voitti!','Tasapeli','Suositeltu ruutu','Vapaita ruutuja','Tietokone miettii…'],en:['Sisko’s better Tic Tac Toe','New game','Undo','Hint','Analysis','Two players','Vs computer','Easy','Medium','Hard','to move','wins!','Draw','Suggested square','Empty squares','Computer thinking…'],hu:['Sisko jobb amőbája','Új játék','Visszavonás','Tipp','Elemzés','Két játékos','Gép ellen','Könnyű','Közepes','Nehéz','következik','nyert!','Döntetlen','Ajánlott mező','Üres mezők','A gép gondolkodik…']};let variant=false,selected='X',player=1,loser=0;let lang=localStorage.getItem('ttlang')||'fi',n=3,mode='ai',level='hard',b=[],turn='X',history=[],pending=null,winning=[],done=false;const t=()=>D[lang],other=p=>p==='X'?'O':'X';function line(a,p){let k=variant||n===3?3:5;for(let i=0;i<a.length;i++){if(a[i]!==p)continue;let x=i%n,y=Math.floor(i/n);for(let [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let xx=x+(k-1)*dx,yy=y+(k-1)*dy;if(xx<0||xx>=n||yy<0||yy>=n)continue;let ids=Array.from({length:k},(_,j)=>(y+j*dy)*n+x+j*dx);if(ids.every(j=>a[j]===p))return ids}}return []}function empty(a){return a.map((v,i)=>v? -1:i).filter(i=>i>=0)}function minimax(a,p,root,depth){if(line(a,root).length)return 10-depth;if(line(a,other(root)).length)return depth-10;let es=empty(a);if(!es.length)return 0;let best=p===root?-Infinity:Infinity;for(let i of es){a[i]=p;let v=minimax(a,other(p),root,depth+1);a[i]='';best=p===root?Math.max(best,v):Math.min(best,v)}return best}function heuristic(a,i,p){let x=i%n,y=Math.floor(i/n),score=n-Math.abs(x-(n-1)/2)-Math.abs(y-(n-1)/2),k=n===3?3:5;for(let [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]])for(let j=0;j<k;j++){let sx=x-j*dx,sy=y-j*dy,ex=sx+(k-1)*dx,ey=sy+(k-1)*dy;if(Math.min(sx,ex,sy,ey)<0||Math.max(sx,ex,sy,ey)>=n)continue;let own=0,opp=0;for(let q=0;q<k;q++){let v=a[(sy+q*dy)*n+sx+q*dx];if(v===p)own++;else if(v===other(p))opp++}if(!opp)score+=Math.pow(8,own);if(!own)score+=Math.pow(8,opp)*.9}return score}function choose(p,l='hard'){let es=empty(b);if(!es.length)return -1;if(l==='easy')return es[Math.floor(Math.random()*es.length)];let best=-Infinity,idx=es[0];for(let i of es){b[i]=p;let win=line(b,p).length;b[i]=other(p);let block=line(b,other(p)).length;b[i]='';let v;if(win)v=1e9;else if(n===3&&l==='hard'){b[i]=p;v=minimax(b,other(p),p,0);b[i]=''}else v=block?1e8:heuristic(b,i,p)+(l==='medium'?Math.random()*5:0);if(v>best){best=v;idx=i}}return idx}const marks={X:'<svg viewBox="0 0 80 80"><path d="M20 20L60 60M60 20L20 60" stroke="#ffb45e" stroke-width="10" stroke-linecap="round"/></svg>',O:'<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="24" stroke="#79c9ff" stroke-width="10" fill="none"/></svg>'};function render(){let board=$('board');if(board.children.length!==b.length){board.replaceChildren();board.style.gridTemplateColumns='repeat('+n+',1fr)';board.style.gridTemplateRows='repeat('+n+',1fr)';b.forEach((_,i)=>{let e=document.createElement('button');e.className='cell';e.setAttribute('aria-label',String(i+1));e.onclick=()=>{if(!pending)(variant?markPlay(i,selected):play(i))};board.append(e)})}b.forEach((v,i)=>{let e=board.children[i];if(e.dataset.mark!==v){e.innerHTML=marks[v]||'';e.dataset.mark=v}e.classList.toggle('win',winning.includes(i));e.classList.remove('hint')});$('status').textContent=winning.length?b[winning[0]]+' '+t()[11]:done?t()[12]:pending?t()[15]:turn+' '+t()[10];if(variant){$('status').textContent=loser?(mode==='ai'?(loser===1?({fi:'Hävisit!',en:'You lost!',hu:'Vesztettél!'}[lang]):({fi:'Voitit!',en:'You won!',hu:'Nyertél!'}[lang])):P()[1]+' '+loser+' '+P()[2]):done?t()[12]:pending?t()[15]:(mode==='ai'?({fi:'Sinun vuorosi',en:'Your turn',hu:'Te következel'}[lang]):P()[1]+' '+player+' '+t()[10]);$('pickX').style.outline=selected==='X'?'3px solid #ffb45e':'none';$('pickO').style.outline=selected==='O'?'3px solid #79c9ff':'none';$('pick').hidden=false;$('pickX').disabled=done||!!pending;$('pickO').disabled=done||!!pending}}function play(i){if(done||b[i]||i<0)return;history.push({b:b.slice(),turn});b[i]=turn;winning=line(b,turn);done=!!winning.length||!empty(b).length;if(!done)turn=other(turn);$('info').textContent='';if(!done&&mode==='ai'&&turn==='O'){pending=setTimeout(()=>{pending=null;play(choose('O',level))},350)}render()}function fresh(){player=1;loser=0;selected='X';clearTimeout(pending);pending=null;b=Array(n*n).fill('');turn='X';history=[];winning=[];done=false;$('info').textContent='';if(Math.random()<.5){if(variant)player=2;else turn='O';if(mode==='ai'){pending=setTimeout(()=>{pending=null;if(variant){let [j,k]=markChoose(level);markPlay(j,k)}else play(choose('O',level))},450)}}render()}const P=()=>({fi:['Markun parempi risti-nolla','Pelaaja','hävisi!','Tavallinen ristinolla'],en:['Markku’s better Tic Tac Toe','Player','lost!','Classic Tic Tac Toe'],hu:['Markku jobb amőbája','Játékos','vesztett!','Hagyományos amőba']}[lang]);function labels(){$('title').textContent=document.title=variant?P()[0]:t()[0];$('variant').innerHTML='<option value="0">'+P()[3]+'</option><option value="1">'+P()[0]+'</option>';$('variant').value=variant?'1':'0';$('size').hidden=variant;$('mode').hidden=variant;$('pick').hidden=!variant;['new','undo','hint','analysis'].forEach((id,i)=>$(id).textContent=t()[i+1]);$('mode').innerHTML='<option value="two">'+t()[5]+'</option><option value="ai">'+t()[6]+'</option>';$('mode').value=mode;$('level').innerHTML=['easy','medium','hard'].map((v,i)=>'<option value="'+v+'">'+t()[7+i]+'</option>').join('');$('level').value=level;$('level').hidden=mode==='two';$('lang').value=lang;render()}$('variant').onchange=()=>{variant=$('variant').value==='1';if(variant){mode='ai';n=3;$('size').value='3'}fresh();labels();close()};$('pickX').onclick=()=>{selected='X';render()};$('pickO').onclick=()=>{selected='O';render()};function close(){$('menu').hidden=true}$('toggle').onclick=()=>$('menu').hidden=!$('menu').hidden;$('new').onclick=()=>{fresh();close()};$('size').onchange=()=>{n=+$('size').value;fresh();close()};$('mode').onchange=()=>{mode=$('mode').value;fresh();labels();close()};$('level').onchange=()=>{level=$('level').value;close()};$('lang').onchange=()=>{lang=$('lang').value;localStorage.setItem('ttlang',lang);labels();close()};$('undo').onclick=()=>{clearTimeout(pending);pending=null;let h=history.pop();if(h&&mode==='ai'&&(variant?h.player===2:h.turn==='O')){if(history.length)h=history.pop();else{history.push(h);close();return}}if(h){b=h.b;turn=h.turn;if(variant){player=h.player;loser=0;}done=false;winning=[];$('info').textContent='';render()}close()};function hint(analysis){close();if(variant){if(done||pending)return;let [i,m]=markChoose('hard');if(i>=0){selected=m;render();$('board').children[i].classList.add('hint');$('info').textContent=t()[13]+': '+m+' · '+(Math.floor(i/n)+1)+', '+(i%n+1)}return}if(done||pending)return;let i=choose(turn);if(i>=0){$('board').children[i].classList.add('hint');$('info').textContent=(analysis?t()[14]+': '+empty(b).length+' · ':'')+t()[13]+': '+(Math.floor(i/n)+1)+', '+(i%n+1)}}$('hint').onclick=()=>hint(false);$('analysis').onclick=()=>hint(true);function markValue(a){let es=empty(a);if(!es.length)return 0;let best=-2;for(let i of es)for(let m of ['X','O']){a[i]=m;let v=line(a,m).length?-1:-markValue(a);a[i]='';best=Math.max(best,v);if(best===1)return best}return best}function markChoose(l){let es=empty(b),opts=[];for(let i of es)for(let m of ['X','O']){b[i]=m;let bad=line(b,m).length;let v=l==='easy'?Math.random():bad?-2:l==='hard'?-markValue(b):Math.random();b[i]='';opts.push([i,m,v])}opts.sort((a,b)=>b[2]-a[2]);return opts[0]||[-1,'X']}function markPlay(i,m){if(done||b[i]||i<0)return;history.push({b:b.slice(),turn,player});b[i]=m;winning=line(b,m);loser=winning.length?player:0;done=!!loser||!empty(b).length;if(!done)player=3-player;$('info').textContent='';if(!done&&mode==='ai'&&player===2){pending=setTimeout(()=>{pending=null;let [j,k]=markChoose(level);markPlay(j,k)},350)}render()}document.addEventListener('click',e=>{if(e.target.closest('button,select,#board,#menu,#pick')||!$('menu').hidden)return;if(confirm(({fi:'Aloitetaanko uusi peli?',en:'Start a new game?',hu:'Új játékot indítasz?'}[lang])))fresh()});fresh();labels();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script></html>
